name: 'Fetch and Filter IPs'

on:
  schedule:
    - cron: '21 */4 * * *' # 每 4 小时第 21 分钟自动运行一次
  workflow_dispatch:      # 支持在 Actions 界面手动点击按钮触发运行

jobs:
  build:
    runs-on: ubuntu-latest

    # 赋予写入权限，避免最后的 git push 发生 403 错误
    permissions:
      contents: write

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v4

      - name: 'Set up Python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 'Install dependencies'
        run: pip install requests

      - name: 'Run Filter Script'
        # 从仓库的 Repository Secrets 安全传递环境变量给脚本
        env:
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_PASS: ${{ secrets.NAS_PASS }}
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_URL2: ${{ secrets.WEBDAV_URL2 }}  # 传入 8443 的环境变量
        run: python dnscf.py

      - name: 'Commit and Push Changes'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ips.txt ips8443.txt               # 同时暂存 ips.txt 和 ips8443.txt
          # 仅在文件有实际改动时才提交，防止产生空提交报错
          git diff --quiet && git diff --staged --quiet || (git commit -m "自动更新优选国别 IP 列表 (443 & 8443)" && git push)
